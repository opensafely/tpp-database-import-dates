version: "5.0"

actions:
  query:
    run: >
      sqlrunner:v1
        --dummy-data-file analysis/dummy_rows.csv.gz
        --output output/query/rows.csv.gz
        --log-file output/query/log.json
        analysis/query.sql
    outputs:
      highly_sensitive:
        rows: output/query/rows.csv.gz
      moderately_sensitive:
        log: output/query/log.json

  latest_import_dates:
    needs: [query]
    run: python:v2 python -m analysis.latest_import_dates
    outputs:
      moderately_sensitive:
        latest_import_dates: output/files_for_release/latest_import_dates.csv

  plot:
    needs: [query]
    run: python:v2 python -m analysis.plot
    outputs:
      moderately_sensitive:
        latest_import_dates: output/plot/plot.png

  render_report:
    needs: [query, latest_import_dates, plot]
    run: python:v2 python -m analysis.render_report
    outputs:
      moderately_sensitive:
        report: output/files_for_release/report.html
